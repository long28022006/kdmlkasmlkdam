<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Photo Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1410;
      --paper: #f5f0e8;
      --accent: #c0392b;
      --muted: #8a7f72;
      --border: #d4c9b8;
      --shadow: rgba(26,20,16,0.18);
    }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    header h1 em {
      font-style: italic;
      color: var(--accent);
    }

    header p {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Preview Panel ── */
    #image {
      position: relative;
      width: min(680px, 100%);
      margin: 0 auto 3rem;
      aspect-ratio: 16/9;
      border: 1px solid var(--border);
      background-color: #e8e2d8;
      background-image: url('');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 6px 6px 0 var(--shadow);
      transition: background-image 0.15s ease;
    }

    #image::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(26,20,16,0.55) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #image.has-image::before { opacity: 1; }

    #caption {
      position: absolute;
      bottom: 1.2rem;
      left: 1.5rem;
      right: 1.5rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: #fff;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    #image.has-image #caption {
      opacity: 1;
      transform: translateY(0);
    }

    #placeholder-text {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-align: center;
      padding: 1rem;
      line-height: 1.7;
      transition: opacity 0.2s ease;
    }

    #image.has-image #placeholder-text { opacity: 0; }

    /* ── Thumbnail Grid ── */
    h2 {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-bottom: 1.2rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      max-width: 780px;
      margin: 0 auto;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border: 1px solid var(--border);
      cursor: crosshair;
      display: block;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      filter: grayscale(20%) contrast(1.05);
    }

    .gallery img:hover {
      transform: translate(-3px, -3px);
      box-shadow: 5px 5px 0 var(--accent);
      filter: grayscale(0%) contrast(1.1);
      z-index: 2;
    }

    footer {
      text-align: center;
      margin-top: 3.5rem;
      font-size: 0.65rem;
      color: var(--border);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<header>
  <h1>Photo <em>Gallery</em></h1>
  <p>Hover to preview &mdash; an interactive showcase</p>
</header>

<!-- Preview panel — id="image" as required by the assignment -->
<div id="image">
  <p id="placeholder-text">Hover over an image below to display here.</p>
  <p id="caption"></p>
</div>

<h2>// Collection</h2>

<div class="gallery">
  <img
    src="https://picsum.photos/seed/alpine/400/300"
    alt="Alpine Meadow"
    onmouseover="upDate(this)"
    onmouseout="unDo()"
  />
  <img
    src="https://picsum.photos/seed/ocean7/400/300"
    alt="Ocean Waves"
    onmouseover="upDate(this)"
    onmouseout="unDo()"
  />
  <img
    src="https://picsum.photos/seed/forest3/400/300"
    alt="Ancient Forest"
    onmouseover="upDate(this)"
    onmouseout="unDo()"
  />
  <img
    src="https://picsum.photos/seed/desert9/400/300"
    alt="Desert Dunes"
    onmouseover="upDate(this)"
    onmouseout="unDo()"
  />
  <img
    src="https://picsum.photos/seed/city22/400/300"
    alt="City at Dusk"
    onmouseover="upDate(this)"
    onmouseout="unDo()"
  />
  <img
    src="https://picsum.photos/seed/lake55/400/300"
    alt="Still Lake"
    onmouseover="upDate(this)"
    onmouseout="unDo()"
  />
</div>

<footer>Interactive Photo Gallery &mdash; JavaScript DOM Assignment</footer>

<script>
  // ─── upDate ───────────────────────────────────────────────
  // Called when the mouse enters a thumbnail image.
  // previewPic  →  the <img> element being hovered
  function upDate(previewPic) {
    // 1. Confirm event is firing
    console.log('upDate triggered');
    console.log('alt:', previewPic.alt, '| src:', previewPic.src);

    const panel = document.getElementById('image');

    // 2. Set the alt text as the displayed caption
    document.getElementById('caption').textContent = previewPic.alt;

    // 3. Change the background image of #image to the hovered photo
    panel.style.backgroundImage = "url('" + previewPic.src + "')";

    // 4. Toggle helper class so CSS transitions fire
    panel.classList.add('has-image');
  }

  // ─── unDo ─────────────────────────────────────────────────
  // Called when the mouse leaves a thumbnail image.
  function unDo() {
    const panel = document.getElementById('image');

    // 1. Clear the background image
    panel.style.backgroundImage = "url('')";

    // 2. Reset caption & placeholder text
    document.getElementById('caption').textContent = '';

    // 3. Remove helper class to restore original state
    panel.classList.remove('has-image');
  }
</script>

</body>
</html>
